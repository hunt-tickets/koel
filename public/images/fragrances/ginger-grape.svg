<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ginger root main body -->
  <g opacity="0.9">
    <!-- Main ginger piece -->
    <path d="M200 180 C220 170, 240 180, 250 200 C260 220, 255 240, 240 250 C220 265, 200 260, 180 250 C160 240, 155 220, 160 200 C165 180, 180 175, 200 180"
          fill="#D4A574" stroke="#B8864F" stroke-width="3"/>

    <!-- Left branch -->
    <path d="M180 200 C170 195, 160 200, 155 210 C150 220, 152 230, 160 235 C168 240, 175 238, 180 230"
          fill="#E8C9A3" stroke="#B8864F" stroke-width="2"/>

    <!-- Right branch -->
    <path d="M240 210 C250 205, 260 208, 265 218 C270 228, 268 238, 260 243 C252 248, 245 246, 240 238"
          fill="#D4A574" stroke="#B8864F" stroke-width="2"/>

    <!-- Top branch -->
    <path d="M210 180 C215 170, 220 165, 230 165 C240 165, 245 170, 245 180 C245 188, 240 192, 230 192"
          fill="#E8C9A3" stroke="#B8864F" stroke-width="2"/>

    <!-- Bottom branch -->
    <path d="M190 250 C185 260, 185 270, 195 280 C205 290, 215 288, 220 278 C225 268, 222 260, 210 255"
          fill="#D4A574" stroke="#B8864F" stroke-width="2"/>
  </g>

  <!-- Ginger texture details -->
  <g opacity="0.4" stroke="#B8864F" stroke-width="1">
    <line x1="195" y1="195" x2="205" y2="200"/>
    <line x1="210" y1="205" x2="220" y2="210"/>
    <line x1="215" y1="220" x2="225" y2="225"/>
    <line x1="205" y1="235" x2="215" y2="240"/>
    <line x1="185" y1="215" x2="195" y2="220"/>
    <line x1="190" y1="230" x2="200" y2="235"/>
  </g>

  <!-- Decorative leaves/sprouts -->
  <g opacity="0.7">
    <!-- Top left sprout -->
    <ellipse cx="175" cy="160" rx="25" ry="8" fill="#88B68D" transform="rotate(-40 175 160)"/>
    <ellipse cx="170" cy="155" rx="20" ry="6" fill="#B5D4B8" transform="rotate(-45 170 155)"/>

    <!-- Top right sprout -->
    <ellipse cx="255" cy="175" rx="25" ry="8" fill="#88B68D" transform="rotate(35 255 175)"/>
    <ellipse cx="260" cy="170" rx="20" ry="6" fill="#B5D4B8" transform="rotate(40 260 170)"/>

    <!-- Bottom sprout -->
    <ellipse cx="220" cy="290" rx="28" ry="9" fill="#88B68D" transform="rotate(15 220 290)"/>
    <ellipse cx="215" cy="295" rx="22" ry="7" fill="#B5D4B8" transform="rotate(10 215 295)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="210" cy="220" r="90" stroke="#D4A574" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="210" cy="220" r="130" stroke="#E8C9A3" stroke-width="1" fill="none" opacity="0.15"/>

  <!-- Small accent dots -->
  <g opacity="0.3" fill="#B8864F">
    <circle cx="180" cy="190" r="3"/>
    <circle cx="230" cy="215" r="3"/>
    <circle cx="200" cy="245" r="3"/>
    <circle cx="245" cy="230" r="2"/>
    <circle cx="165" cy="220" r="2"/>
  </g>
</svg>
