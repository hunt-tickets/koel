<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bamboo stems -->
  <g opacity="0.9">
    <!-- Left stem -->
    <line x1="120" y1="350" x2="120" y2="50" stroke="#88B68D" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="280" r="4" fill="#5F9465"/>
    <circle cx="120" cy="200" r="4" fill="#5F9465"/>
    <circle cx="120" cy="120" r="4" fill="#5F9465"/>

    <!-- Middle stem -->
    <line x1="200" y1="350" x2="200" y2="80" stroke="#88B68D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="200" cy="300" r="5" fill="#5F9465"/>
    <circle cx="200" cy="220" r="5" fill="#5F9465"/>
    <circle cx="200" cy="140" r="5" fill="#5F9465"/>

    <!-- Right stem -->
    <line x1="280" y1="350" x2="280" y2="100" stroke="#88B68D" stroke-width="8" stroke-linecap="round"/>
    <circle cx="280" cy="290" r="4" fill="#5F9465"/>
    <circle cx="280" cy="210" r="4" fill="#5F9465"/>
    <circle cx="280" cy="130" r="4" fill="#5F9465"/>
  </g>

  <!-- Bamboo leaves -->
  <g opacity="0.8">
    <!-- Left leaves -->
    <ellipse cx="90" cy="100" rx="40" ry="12" fill="#88B68D" transform="rotate(-30 90 100)"/>
    <ellipse cx="85" cy="140" rx="35" ry="10" fill="#B5D4B8" transform="rotate(-45 85 140)"/>
    <ellipse cx="95" cy="180" rx="38" ry="11" fill="#88B68D" transform="rotate(-20 95 180)"/>

    <!-- Middle leaves -->
    <ellipse cx="170" cy="70" rx="45" ry="13" fill="#5F9465" transform="rotate(-35 170 70)"/>
    <ellipse cx="230" cy="90" rx="42" ry="12" fill="#88B68D" transform="rotate(30 230 90)"/>
    <ellipse cx="175" cy="120" rx="40" ry="11" fill="#B5D4B8" transform="rotate(-25 175 120)"/>
    <ellipse cx="225" cy="140" rx="38" ry="10" fill="#88B68D" transform="rotate(35 225 140)"/>

    <!-- Right leaves -->
    <ellipse cx="310" cy="110" rx="40" ry="12" fill="#88B68D" transform="rotate(30 310 110)"/>
    <ellipse cx="315" cy="150" rx="35" ry="10" fill="#B5D4B8" transform="rotate(45 315 150)"/>
    <ellipse cx="305" cy="190" rx="38" ry="11" fill="#88B68D" transform="rotate(20 305 190)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="80" stroke="#88B68D" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="200" cy="200" r="120" stroke="#B5D4B8" stroke-width="1" fill="none" opacity="0.15"/>
</svg>
